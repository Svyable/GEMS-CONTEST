# Segment Anything 2 Hiera-small image encoder. A hierarchical vision
# transformer, run as one U-Net on Apple MPS. Input is 224 because Hiera's
# pretrained positions are tied to that size.
seed_sequence: [20260922]
data:
  normalization: per_channel_minmax_over_full_raster
  negative_ratio: 1.0
patches:
  patch_size: 224
  train_step: 112
model:
  family: unet
  library: segmentation_models_pytorch
  encoder: tu-sam2_hiera_small
  encoder_weights: imagenet
  classes: 1
training:
  epochs: 10
  batch_size: 4
  optimizer: adamw
  learning_rate: 0.0001
  loss: tversky
  alpha: 0.2
  beta: 0.8
augmentation:
  random_resized_crop:
    scale: [0.8, 1.0]
    ratio: [0.75, 1.33]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  random_rotation_degrees: 30

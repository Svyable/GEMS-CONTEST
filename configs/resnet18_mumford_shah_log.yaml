# ResNet-18 U-Net with Mumford-Shah LoG edge-strength features (roadmap #3)
# Laplacian of Gaussian edge detection on grouped geophysical bands
seed_sequence: [20260922]
data:
  normalization: per_channel_minmax_over_training_region
  negative_ratio: 1.0
patches:
  patch_size: 128
  train_step: 32
model:
  family: unet
  library: segmentation_models_pytorch
  encoder: resnet18
  encoder_weights: imagenet
  classes: 1
training:
  epochs: 20
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0001
  loss: tversky
  alpha: 0.2
  beta: 0.8
augmentation:
  random_resized_crop:
    scale: [0.8, 1.0]
    ratio: [0.75, 1.33]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  random_rotation_degrees: 30
derived_features:
  lineament:
    enabled: true
    categories:
      - magnetic_data
      - gravity_data
      - geodetic_strain
      - topographic
    sigma_pixels: 1.0
    phase_epsilon_pixels: 1.0
    kind: mumford_shah_log

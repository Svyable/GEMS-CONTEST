# LOCAL CANDIDATE: configs/reference_unet.yaml (incumbent, unchanged) with the training
# loss replaced by the P1 distance-aware Tversky blend (docs/research/METRIC_AWARE_RESEARCH_2026-10-10.md).
# Everything else (model, seed, epochs, train_step, buffer, augmentation) is identical to the
# incumbent so the gate compares training losses, not budgets.
# Parameters transcribed from the organizer's public reference notebook.
# This is the reproduction target, not our preferred validation design.
seed_sequence: [0, 10, 20, 30, 40]
monte_carlo_iterations: 5
data:
  organizer_reference_feature_filename: numeric_features.tif
  competition_page_feature_filename: training_features.tif
  labels_filename: labels.tif
  # Actual DrivenData download names. Do not rename the files.
  local_feature_filename: gems-geodawn-numerical-features.tif
  local_labels_filename: existing_faults.tif
  local_submission_template_filename: example_submission.tif
  local_dem_links_filename: tnm_items.json
  normalization: per_channel_minmax_over_full_raster
  use_all_channels: true
patches:
  patch_size: 128
  train_step: 32
  test_proportion: 0.5
model:
  family: unet
  library: segmentation_models_pytorch
  encoder: resnet18
  encoder_weights: imagenet
  classes: 1
training:
  epochs: 5
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0001
  loss: distance_tversky
  alpha: 0.2
  beta: 0.8
  # Blend weight is FIXED before evaluation (P1 acceptance experiment). Tune only
  # inside training folds if a follow-up experiment justifies it.
  loss_distance_weight: 0.5
  loss_radius_pixels: 3.0
  loss_halo_pixels: 0
augmentation:
  random_resized_crop:
    scale: [0.5, 1.0]
    ratio: [0.75, 1.33]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  random_rotation_degrees: 30
notes:
  - The organizer baseline randomly holds out non-overlapping positive patches.
  - Its full-raster min/max normalization leaks global feature statistics across folds.
  - Reproduce it first, then use spatial/fault-discovery CV for model selection.

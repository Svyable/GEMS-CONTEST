# Train-on-all candidate. Same architecture as the organizer U-Net, with two
# deliberate changes: more epochs, because the 5-epoch reference loss was still
# falling, and a milder crop so thin fault traces are not resized away.
seed_sequence: [20260922]
monte_carlo_iterations: 1
data:
  local_feature_filename: gems-geodawn-numerical-features.tif
  local_labels_filename: existing_faults.tif
  local_submission_template_filename: example_submission.tif
  normalization: per_channel_minmax_over_full_raster
  use_all_channels: true
  negative_ratio: 1.0
patches:
  patch_size: 128
  train_step: 32
  overlap: 64
model:
  family: unet
  library: segmentation_models_pytorch
  encoder: resnet18
  encoder_weights: imagenet
  classes: 1
training:
  epochs: 20
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0001
  loss: tversky
  alpha: 0.2
  beta: 0.8
augmentation:
  random_resized_crop:
    scale: [0.8, 1.0]
    ratio: [0.75, 1.33]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  random_rotation_degrees: 30

# Multiscale Hessian ridge/valley ablation; use --buffer-pixels 30 or more.
# Normalization and derived-response scaling use training-fold pixels only.
seed_sequence: [20260922]
data:
  normalization: per_channel_minmax_over_training_region
  negative_ratio: 1.0
patches:
  patch_size: 128
  train_step: 32
model:
  family: unet
  library: segmentation_models_pytorch
  encoder: resnet18
  encoder_weights: imagenet
  classes: 1
training:
  epochs: 20
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0001
  loss: tversky
  alpha: 0.2
  beta: 0.8
augmentation:
  random_resized_crop:
    scale: [0.8, 1.0]
    ratio: [0.75, 1.33]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  random_rotation_degrees: 30

derived_features:
  lineament:
    enabled: true
    categories:
      - magnetic_data
      - gravity_data
      - geodetic_strain
      - topographic
    kind: ridge_valley_response
    sigma_pixels: 1.0
    ridge_valley_scales: [1.0, 2.0, 4.0]
    structure_tensor_window: 3.0

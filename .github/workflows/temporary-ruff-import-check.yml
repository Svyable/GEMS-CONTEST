name: temporary Ruff import-layout diagnostic

on:
  push:
    branches: [fix/fold-pure-lineament-configs-20261009]

jobs:
  import-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check --select I001 --fix --diff tests/test_lineament_config.py || true

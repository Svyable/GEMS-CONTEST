[project]
name = "gems-contest"
version = "0.1.0"
description = "Competition tooling and experiments for the DOE/NLR GEMS Prize"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.4",
  "scipy>=1.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "segmentation-models-pytorch>=0.5",
]
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu126 = ["torch>=2.6", "torchvision>=0.21"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.uv]
package = true
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", extra = "cu126", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cpu", extra = "cu126", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/gems"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
